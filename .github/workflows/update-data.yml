name: Update Market Data

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # manual trigger button in GitHub UI

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch market data and write data.json
        run: |
          python3 - <<'EOF'
          import urllib.request, json, csv, io, os

          result = {
            "timestamp": "",
            "vix": None, "ftse_price": None, "sma200": None, "sma50": None,
            "fng": None, "treasury": None,
            "yield_curve": None, "real_rate": None, "margin_debt": None,
            "buffett": None,      # Buffett Indicator: Wilshire5000 / GDP * 100 (%)
            # Market Conditions Score Engine - 6 FRED-Serien
            "unrate": None, "icsa": None, "hys": None,
            "fedfunds": None, "eurusd": None, "umcsent": None
          }

          from datetime import datetime, timezone
          result["timestamp"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          FRED_KEY = os.environ.get("FRED_API_KEY", "")

          # ── Hilfsfunktion: FRED-API abrufen ─────────────────────
          def fetch_fred(series_id):
              if not FRED_KEY:
                  raise ValueError("FRED_API_KEY nicht gesetzt")
              url = (f"https://api.stlouisfed.org/fred/series/observations"
                     f"?series_id={series_id}&api_key={FRED_KEY}"
                     f"&file_type=json&sort_order=desc&limit=36")
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  data = json.loads(r.read())
              for obs in data["observations"]:
                  v = obs.get("value", ".")
                  if v and v != ".":
                      return float(v)
              raise ValueError(f"Kein gueltiger Wert fuer {series_id}")

          # --- VIX via CBOE ---
          try:
              url = "https://cdn.cboe.com/api/global/delayed_quotes/charts/historical/_VIX.json"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  data = json.loads(r.read())
              entries = data["data"]
              result["vix"] = float(entries[-1]["close"])
              print(f"VIX: {result['vix']}")
          except Exception as e:
              print(f"VIX error: {e}")

          # --- FTSE / VWCE: Yahoo Finance (primaer), justETF (Fallback) ---
          # Stooq wurde 2026 hinter eine JS-Bot-Pruefung gestellt und liefert
          # keine CSV mehr -> daher zwei neue Quellen mit Browser-User-Agent.
          BROWSER_UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                        "(KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36")

          def closes_from_yahoo():
              url = ("https://query2.finance.yahoo.com/v8/finance/chart/VWCE.DE"
                     "?range=2y&interval=1d")
              req = urllib.request.Request(url, headers={
                  "User-Agent": BROWSER_UA,
                  "Accept": "application/json,text/plain,*/*",
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  data = json.loads(r.read())
              quote = data["chart"]["result"][0]["indicators"]["quote"][0]
              return [float(c) for c in quote["close"] if c is not None]

          def closes_from_justetf():
              url = ("https://www.justetf.com/api/etfs/IE00BK5BQT80/performance-chart"
                     "?locale=de&currency=EUR&valuesType=MARKET_VALUE"
                     "&reduceData=false&includeDividends=false&features=DIVIDENDS")
              req = urllib.request.Request(url, headers={
                  "User-Agent": BROWSER_UA,
                  "Accept": "application/json,text/plain,*/*",
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  data = json.loads(r.read())
              return [float(p["value"]["raw"]) for p in data["series"]
                      if p.get("value", {}).get("raw") is not None]

          # Yahoo liefert Handelstage, justETF Kalendertage -> Fenster skalieren
          # (200 Handelstage entsprechen rund 288 Kalendertagen).
          closes, win200, win50 = [], 200, 50
          for name, loader, w200, w50 in (
                  ("Yahoo",   closes_from_yahoo,   200, 50),
                  ("justETF", closes_from_justetf, 288, 72)):
              try:
                  c = loader()
                  if len(c) >= w200:
                      closes, win200, win50 = c, w200, w50
                      print(f"FTSE-Quelle: {name} ({len(c)} Datenpunkte)")
                      break
                  print(f"FTSE {name}: zu wenige Datenpunkte ({len(c)})")
              except Exception as e:
                  print(f"FTSE {name} error: {e}")

          if closes:
              result["ftse_price"] = round(closes[-1], 2)
              last200 = closes[-win200:]
              last50  = closes[-win50:]
              result["sma200"] = round(sum(last200) / len(last200), 4)
              result["sma50"]  = round(sum(last50)  / len(last50),  4)
              print(f"FTSE: {result['ftse_price']}  SMA200: {result['sma200']}  SMA50: {result['sma50']}")
          else:
              print("FTSE error: keine Quelle lieferte Daten")

          # --- Fear & Greed (CNN) ---
          try:
              url = "https://production.dataviz.cnn.io/index/fearandgreed/graphdata"
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Referer": "https://edition.cnn.com/markets/fear-and-greed",
                  "Origin": "https://edition.cnn.com",
              })
              with urllib.request.urlopen(req, timeout=10) as r:
                  data = json.loads(r.read())
              result["fng"] = float(data["fear_and_greed"]["score"])
              print(f"F&G (CNN): {result['fng']}")
          except Exception as e:
              print(f"F&G CNN error: {e}")

          # ── FRED: 10J US-Treasury-Rendite (DGS10) ────────────
          # Ersetzt den Yahoo-^TNX-Abruf im Browser (scheiterte an CORS-Proxies)
          try:
              result["treasury"] = round(fetch_fred("DGS10"), 3)
              print(f"Treasury 10J (DGS10): {result['treasury']}%")
          except Exception as e:
              print(f"FRED DGS10 error: {e}")

          # ── FRED: Zinskurve (10J - 2J Spread) ──────────────────
          # T10Y2Y: positiv = gesund, negativ = Rezessionswarnung
          try:
              result["yield_curve"] = round(fetch_fred("T10Y2Y"), 4)
              print(f"Zinskurve (T10Y2Y): {result['yield_curve']}")
          except Exception as e:
              print(f"FRED Zinskurve error: {e}")

          # ── FRED: Realzins 10J inflationsbereinigt ──────────────
          # DFII10: < 0% = günstig für Aktien, > 2% = starker Gegenwind
          try:
              result["real_rate"] = round(fetch_fred("DFII10"), 4)
              print(f"Realzins (DFII10): {result['real_rate']}")
          except Exception as e:
              print(f"FRED Realzins error: {e}")

          # ── FRED: Margin Debt (Mrd. USD) ────────────────────────
          # BOGZ1FL663067003Q: Quartalsweise in Millionen USD
          try:
              margin_millions = fetch_fred("BOGZ1FL663067003Q")
              result["margin_debt"] = round(margin_millions / 1000, 1)  # → Mrd. USD
              print(f"Margin Debt (FRED): ${result['margin_debt']}B")
          except Exception as e:
              print(f"FRED Margin Debt error: {e}")

          # ── FRED: Arbeitslosenquote (UNRATE) ────────────────────
          try:
              result["unrate"] = round(fetch_fred("UNRATE"), 2)
              print(f"Unemployment: {result['unrate']}%")
          except Exception as e:
              print(f"FRED UNRATE error: {e}")

          # ── FRED: Initial Jobless Claims 4-Wochen-Avg (ICSA) ────
          try:
              url_icsa = (f"https://api.stlouisfed.org/fred/series/observations"
                          f"?series_id=ICSA&api_key={FRED_KEY}"
                          f"&file_type=json&sort_order=desc&limit=5")
              req = urllib.request.Request(url_icsa, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  icsa_data = json.loads(r.read())
              icsa_vals = [float(o["value"]) for o in icsa_data["observations"] if o.get("value",".")!="."]
              if icsa_vals:
                  result["icsa"] = round(sum(icsa_vals[:4]) / min(4, len(icsa_vals)))
              print(f"Initial Claims (4w avg): {result['icsa']:,.0f}")
          except Exception as e:
              print(f"FRED ICSA error: {e}")

          # ── FRED: High-Yield OAS Spread (BAMLH0A0HYM2) ──────────
          try:
              result["hys"] = round(fetch_fred("BAMLH0A0HYM2"), 3)
              print(f"HY Spread: {result['hys']}%")
          except Exception as e:
              print(f"FRED HYS error: {e}")

          # ── FRED: Federal Funds Rate (FEDFUNDS) ──────────────────
          try:
              result["fedfunds"] = round(fetch_fred("FEDFUNDS"), 4)
              print(f"Fed Funds: {result['fedfunds']}%")
          except Exception as e:
              print(f"FRED FEDFUNDS error: {e}")

          # ── FRED: EUR/USD Wechselkurs (DEXUSEU) ──────────────────
          try:
              result["eurusd"] = round(fetch_fred("DEXUSEU"), 4)
              print(f"EUR/USD: {result['eurusd']}")
          except Exception as e:
              print(f"FRED EURUSD error: {e}")

          # ── FRED: Univ. Michigan Consumer Sentiment (UMCSENT) ────
          try:
              result["umcsent"] = round(fetch_fred("UMCSENT"), 1)
              print(f"Consumer Sentiment: {result['umcsent']}")
          except Exception as e:
              print(f"FRED UMCSENT error: {e}")

          # ── FRED: Buffett-Indikator Proxy via SP500 ──────────────────────
          # SP500 = Index-Level (z.B. 5500). US MarketCap ≈ SP500 * 7.3 Mrd.
          # (SP500=5500 → ~$40T = 40,000 Mrd. | GDP ~$28,000 Mrd. → 143%)
          # GDP ist in Mrd. USD (annual rate)
          try:
              sp500 = fetch_fred("SP500")   # S&P 500 Index Level
              gdp   = fetch_fred("GDP")     # Nominales BIP USA in Mrd. USD
              if sp500 and gdp and gdp > 0:
                  estimated_mcap_bn = sp500 * 7.3  # Index-Level → US MarketCap in Mrd.
                  result["buffett"] = round((estimated_mcap_bn / gdp) * 100, 1)
              print(f"Buffett Proxy (SP500*7.3/GDP): {result['buffett']}%")
          except Exception as e:
              print(f"FRED Buffett error: {e}")

          with open("data.json", "w") as f:
              json.dump(result, f, indent=2)
          print("data.json written:", json.dumps(result))
          EOF

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update market data [skip ci]"
          git push
